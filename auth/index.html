<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール確認完了 - Hearth</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --brand-warm: #E8760A;
      --warm-bg: #F8F7F4;
      --text: #1F2937;
      --text-sub: #6B7280;
      --text-light: #9CA3AF;
      --white: #FFFFFF;
      --font-ja: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      --font-en: 'Inter', sans-serif;
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font-ja);
      color: var(--text);
      background: var(--warm-bg);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      max-width: 440px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      margin-bottom: 32px;
      display: flex;
      justify-content: center;
    }
    .logo img {
      height: 32px;
      width: auto;
    }

    .check-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: scaleIn 0.5s ease-out 0.2s both;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }
    .check-icon svg { width: 32px; height: 32px; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .description {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 32px;
      line-height: 1.8;
    }

    .btn-primary {
      display: inline-block;
      width: 100%;
      padding: 16px 24px;
      background: var(--accent);
      color: var(--white);
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-ja);
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .store-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-light);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    .store-link:hover { color: var(--text-sub); }

    .countdown {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-light);
    }
    .countdown span { font-variant-numeric: tabular-nums; }

    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #F0EDE8;
      font-size: 12px;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/assets/Hearth-logo-trans-size.png" alt="Hearth"></div>

    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>メールアドレスの確認が<br>完了しました</h1>
    <p class="description">
      ご登録ありがとうございます。<br>
      アプリに戻って、あなただけのメンタリングをはじめましょう。
    </p>

    <a href="hearth://auth/callback" class="btn-primary" id="openApp">
      アプリに戻ってはじめる
    </a>

    <a href="https://apps.apple.com/app/hearth/id6746268436" class="store-link" id="storeLink">
      アプリが開かない場合はこちら
    </a>

    <p class="countdown" id="countdown">
      <span id="seconds">3</span> 秒後に自動でアプリを開きます...
    </p>

    <div class="footer">
      Hearth - 声にすると、見えてくる。
    </div>
  </div>

  <script>
    (function() {
      // Supabase はリダイレクト時にトークンを URL fragment に付与する
      // 例: #access_token=xxx&refresh_token=xxx&type=signup
      var hash = window.location.hash;
      var deepLink = 'hearth://auth/callback' + (hash || '');

      // ボタンのリンク先にトークンを付与
      var openAppEl = document.getElementById('openApp');
      if (openAppEl) openAppEl.href = deepLink;

      var remaining = 3;
      var countdownEl = document.getElementById('seconds');
      var countdownWrapper = document.getElementById('countdown');

      var timer = setInterval(function() {
        remaining--;
        if (countdownEl) countdownEl.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          if (countdownWrapper) countdownWrapper.textContent = 'アプリを開いています...';
          window.location.href = deepLink;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
